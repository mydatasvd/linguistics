<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>French Daily Conversations – Interrogative</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0ede8;color:#1a1a2e;min-height:100vh}

/* HEADER */
.hero{background:#0f172a;color:#fff;padding:2.5rem 2rem 2rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"PARLER";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9rem;font-weight:900;color:rgba(255,255,255,0.04);letter-spacing:0.15em;pointer-events:none;white-space:nowrap}
.hero-eyebrow{display:inline-block;border:1px solid rgba(255,255,255,0.25);border-radius:99px;font-size:11px;letter-spacing:0.12em;padding:5px 14px;margin-bottom:1.1rem;color:rgba(255,255,255,0.7);text-transform:uppercase}
.hero h1{font-family:'Playfair Display',serif;font-size:3rem;font-weight:700;line-height:1.1;margin-bottom:0.6rem}
.hero h1 em{font-style:italic;color:#e8a020}
.hero p{font-size:13.5px;color:rgba(255,255,255,0.55);margin-bottom:1.4rem}
.hero-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:500;cursor:default}
.pill-dark{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.15)}
.pill-amber{background:#e8a020;color:#1a1a2e}
.pill-light{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75);border:1px solid rgba(255,255,255,0.12)}

/* FILTERS */
.filters{background:#fff;border-bottom:1px solid #e2ddd8;padding:1rem 2rem;position:sticky;top:0;z-index:20}
.search-row{display:flex;align-items:center;gap:10px;margin-bottom:0.75rem}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#999;pointer-events:none}
#search{width:100%;padding:9px 12px 9px 36px;border:1px solid #ddd;border-radius:8px;font-size:14px;color:#1a1a2e;background:#fafafa}
#search:focus{outline:2px solid #1e3a5f;outline-offset:1px;background:#fff}
.cat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:0.6rem}
.cat-btn{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:500;border:1px solid #ddd;background:#fff;color:#555;cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:#999;color:#1a1a2e}
.cat-btn.active{background:#0f172a;color:#fff;border-color:#0f172a}
.lvl-pills{display:flex;gap:6px}
.lvl-btn{padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid #ddd;background:#fff;cursor:pointer;transition:all .15s}
.lvl-btn.active-all{background:#e8a020;color:#fff;border-color:#e8a020}
.lvl-btn.active-a2{background:#16a34a;color:#fff;border-color:#16a34a}
.lvl-btn.active-b1{background:#2563eb;color:#fff;border-color:#2563eb}
.lvl-btn:not(.active-all):not(.active-a2):not(.active-b1):hover{border-color:#999}

/* MAIN */
main{max-width:1300px;margin:0 auto;padding:1.5rem 2rem 4rem}
.stats{font-size:12px;color:#888;margin-bottom:1.25rem}

/* SECTION */
.section{margin-bottom:2.5rem}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem}
.section-title{display:flex;align-items:center;gap:8px;font-size:1.1rem;font-weight:700;color:#0f172a}
.section-count{font-size:12px;color:#888}

/* TABLE */
.tbl-wrap{border-radius:10px;overflow:hidden;border:1px solid #ddd;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:#0f172a}
thead th{padding:10px 14px;font-size:12px;font-weight:600;letter-spacing:0.05em;color:rgba(255,255,255,0.85);text-align:left}
thead th:first-child{width:40px;text-align:center}
thead th:last-child{width:80px;text-align:center}
tbody tr{background:#fff;border-bottom:1px solid #f0ede8}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#faf9f7}
td{padding:10px 14px;vertical-align:top;font-size:13.5px;line-height:1.5}
td:first-child{text-align:center;color:#bbb;font-size:12px;font-weight:500}
td:last-child{text-align:center}
.informal{color:#1e3a8a;font-weight:500}
.formal{color:#065f46;font-weight:500}
.english{color:#555;font-style:italic}
.badge-a2{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.badge-b1{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
.empty{text-align:center;padding:3rem;color:#aaa;font-size:14px}
@media(max-width:700px){thead th:nth-child(3),td:nth-child(3){display:none}main{padding:1rem}table{table-layout:auto}thead th:last-child,td:last-child{width:60px}}
@media print{.filters,.hero-pills{display:none}.hero{padding:1rem}}
</style>
</head>

<div class="hero">
  <div class="hero-eyebrow">SET 1 — INTERROGATIVE</div>
  <h1>French Daily <em>Conversations</em></h1>
  <p>500 interrogative sentences for everyday life · Du matin jusqu'au soir · A2 + B1</p>
  <div class="hero-pills">
    <span class="pill pill-dark">🔵 500 sentences</span>
    <span class="pill pill-amber">20 categories</span>
    <span class="pill pill-light">🔵 Informal · 🟢 Formal · 🇬🇧 English</span>
    <span class="pill pill-light">A2 + B1 level</span>
  </div>
</div>

<div class="filters">
  <div class="search-row">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search in French or English… e.g. café, bureau, docteur">
    </div>
  </div>
  <div class="cat-pills" id="cats"></div>
  <div class="lvl-pills">
    <button class="lvl-btn active-all" onclick="setLvl('all',this)">All Levels</button>
    <button class="lvl-btn" onclick="setLvl('A2',this)">🟢 A2</button>
    <button class="lvl-btn" onclick="setLvl('B1',this)">🔵 B1</button>
  </div>
</div>

<main>
  <div class="stats" id="stats"></div>
  <div id="out"></div>
</main>

const ORDER=["🌅 Morning","🚿 Bathroom","💪 Gym","☕ Breakfast","🚶 Street","🚇 Metro","🖥️ Office","🍽️ Lunch","🛍️ Shopping","🏥 Doctor","🏦 Bank","📱 Phone","🌆 Evening","🍷 Dinner","🎉 Social","💬 Feelings","💭 Small Talk","🚨 Emergency","🌙 Bedtime"];
let activeCat="All", activeLvl="all";

function init(){
  const cats=["All",...ORDER.map(s=>s.split(" ").slice(1).join(" "))];
  const cd=document.getElementById("cats");
  cd.innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="cat-btn"+(c==="All"?" active":"");
    // label with emoji
    const match=ORDER.find(o=>o.includes(c));
    b.textContent=match||c;
    b.onclick=()=>{
      document.querySelectorAll(".cat-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      activeCat=c;
      render();
    };
    cd.appendChild(b);
  });
}

window.setLvl=function(l,btn){
  activeLvl=l;
  document.querySelectorAll(".lvl-btn").forEach(b=>{b.className="lvl-btn"});
  btn.className="lvl-btn active-"+l;
  render();
};

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const f=D.filter(d=>{
    if(activeCat!=="All"&&!d.s.includes(activeCat))return false;
    if(activeLvl!=="all"&&d.l!==activeLvl)return false;
    if(q&&!d.i.toLowerCase().includes(q)&&!d.f.toLowerCase().includes(q)&&!d.e.toLowerCase().includes(q))return false;
    return true;
  });
  document.getElementById("stats").textContent=`Showing ${f.length} of ${D.length} phrases`;
  if(!f.length){document.getElementById("out").innerHTML='<div class="empty">Aucune phrase trouvée.</div>';return;}
  const g={};
  f.forEach(d=>{if(!g[d.s])g[d.s]=[];g[d.s].push(d);});
  let h="";
  ORDER.forEach(sec=>{
    if(!g[sec])return;
    h+=`<div class="section"><div class="section-head"><div class="section-title">${sec}</div><span class="section-count">${g[sec].length} sentences</span></div>
    <div class="tbl-wrap"><table>
    <thead><tr><th>#</th><th>🔵 Informal French</th><th>🟢 Formal French</th><th>🇬🇧 English</th><th>Lvl</th></tr></thead><tbody>`;
    g[sec].forEach((d,i)=>{
      h+=`<tr><td>${i+1}</td><td class="informal">${d.i}</td><td class="formal">${d.f}</td><td class="english">${d.e}</td><td><span class="badge-${d.l.toLowerCase()}">${d.l}</span></td></tr>`;
    });
    h+=`</tbody></table></div></div>`;
  });
  document.getElementById("out").innerHTML=h;
}

init();render();
document.getElementById("search").addEventListener("input",render);
</script>
